<!doctype html>
<html lang="ja" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>EikenQuest — 英検5級〜1級 学習アプリ</title>
  <meta name="theme-color" content="#0b0f19" />

  <!-- iOS Home Screen Icons (Apple standard specifications) -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="EikenQuest" />

  <!-- Open Graph & Social sharing (Safari WebClip inspection fallback) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="EikenQuest" />
  <meta property="og:description" content="英検5級〜1級 学習アプリ" />
  <meta property="og:image" content="https://eiken-quest-self.vercel.app/og-image.png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />

  <!-- Favicons and PWA icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/brand-icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/brand-icon-512.png" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.json" />
  <script>
    /* Apply the saved theme before first paint to avoid a light-theme flash. */
    (function () {
      try {
        var raw = localStorage.getItem("eikenquest.state.v1");
        var pref = raw ? ((JSON.parse(raw) || {}).settings || {}).theme : "system";
        var dark =
          pref === "dark" ||
          (pref === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {
        /* keep the default light theme */
      }
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Shippori+Mincho:wght@500;700&family=Yomogi&family=DotGothic16&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <div id="modal-root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
